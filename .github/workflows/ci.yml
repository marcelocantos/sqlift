name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install cv
        run: |
          CV_VERSION=$(gh release view --repo marcelocantos/cv --json tagName -q .tagName)
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARCH="darwin-arm64"
          else
            ARCH="linux-amd64"
          fi
          curl -sL "https://github.com/marcelocantos/cv/releases/download/${CV_VERSION}/cv-${CV_VERSION#v}-${ARCH}.tar.gz" | sudo tar xz -C /usr/local/bin cv
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/sqlift/go.mod

      # The same gate the pre-push hook runs: cv bundle + drift check,
      # cv test, cv sanitize, then go vet and go test in go/sqlift.
      - run: make gate
